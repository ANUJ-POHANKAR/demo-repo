apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:latest
        ports:
        - containerPort: 3306
        env:
          - name: MYSQL_USER
            valueFrom:
            secretKeyRef:
              name: database1
              key: MYSQL_USER
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
            secretKeyRef:
              name: database1
              key: MYSQL_ROOT_PASSWORD
          - name: MYSQL_PASSWORD
            valueFrom:
            secretKeyRef:
              name: database1
              key: MYSQL_PASSWORD
