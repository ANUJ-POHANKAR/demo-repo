apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy2
spec:
  replicas: 2
  selector:
    matchLabels:
      pod: pod2
  template:
    metadata:
      labels:
        pod: pod2
    spec:
      containers:
        - name: container1
          image: nginx:latest
          ports:
            - containerPort: 80
    
  
